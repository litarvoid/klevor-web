<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta · KLEVOR</title>
<meta name="robots" content="noindex">
<link rel="icon" href="imagenes/icono.png">
<link rel="stylesheet" href="cookies.css">
<link rel="stylesheet" href="comunidad.css">
<style>
:root{--fondo:#070c1c;--tarjeta:#0f1a38;--borde:#1f3566;--azul:#2f8cff;--azul2:#7fc4ff;--texto:#dbe8ff;--suave:#9fb4e0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 80% 0,rgba(40,120,255,.16),transparent 50%),var(--fondo);color:var(--texto);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.6;font-size:16.5px;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--azul2)}
nav{position:sticky;top:0;z-index:10;background:rgba(7,12,28,.85);backdrop-filter:blur(8px);border-bottom:1px solid #12204a}
.centro{max-width:880px;margin:0 auto;padding:0 22px;width:100%}
nav .centro{display:flex;align-items:center;justify-content:space-between;height:62px}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#fff;text-decoration:none;letter-spacing:.5px}
.marca img{width:32px;height:32px}
.der{display:flex;align-items:center;gap:6px}
.volver{color:var(--suave);text-decoration:none;font-size:15px}
.volver:hover{color:#fff}
main{padding:44px 0 70px;flex:1}
h1{font-size:clamp(32px,6vw,44px);color:#fff;line-height:1.15;margin-bottom:24px}
.perfil{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#102352,#0c1736);border:1px solid #2a4f8f;
  border-radius:20px;padding:24px;margin-bottom:22px;animation:k-sube .4s ease}
.perfil .k-avatar{width:84px!important;height:84px!important;font-size:32px}
.perfil h2{color:#fff;font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.perfil p{color:var(--suave);font-size:15px;overflow-wrap:anywhere}
.bloque{background:var(--tarjeta);border:1px solid var(--borde);border-radius:18px;padding:24px;margin-bottom:22px;animation:k-sube .45s ease both}
.bloque h3{color:#fff;font-size:20px;margin-bottom:4px}
.bloque > p.sub2{color:var(--suave);font-size:15px;margin-bottom:18px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 0;border-top:1px solid #182b57}
.fila:first-of-type{border-top:0}
.fila b{color:#fff;display:block;font-size:15.5px}
.fila small{color:var(--suave);font-size:14px;display:block}
.fila .k-campo{margin:0;flex:1}
.interruptor{position:relative;display:inline-block;width:52px;height:30px;flex:none;cursor:pointer}
.interruptor input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.interruptor span{position:absolute;inset:0;background:#24345e;border-radius:999px;transition:background .2s}
.interruptor span::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#dbe8ff;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.interruptor input:checked+span{background:#2f8cff}
.interruptor input:checked+span::after{transform:translateX(22px);background:#fff}
.interruptor input:focus-visible+span{outline:2px solid #7fc4ff;outline-offset:2px}
.alias{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alias input{flex:1;min-width:180px}
.mis{display:grid;gap:14px}
.chats{display:grid;gap:10px}
.chat{background:#0b1430;border:1px solid #1a2d5c;border-radius:14px;padding:12px 14px}
.chat-cabeza{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chat-cabeza b{color:#fff;display:block;overflow-wrap:anywhere}
.chat-cabeza small{color:var(--suave)}
.conversacion{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;padding:4px 2px;margin-bottom:12px}
.burbuja{max-width:85%;border-radius:14px;padding:8px 12px}
.burbuja small{display:block;color:var(--suave);font-size:12px;margin-bottom:2px}
.burbuja p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#dbe8ff;font-size:15px}
.burbuja.tuya{align-self:flex-end;background:#1d3266;border:1px solid #2a4f8f}
.burbuja.de-klevor{align-self:flex-start;background:#0f1f45;border:1px solid #1f3566}
.peligro{border-color:#4a2030}
.peligro h3{color:#ffb3b3}
.puerta{text-align:center;padding:60px 24px}
.puerta h1{margin-bottom:10px}
.puerta p{color:var(--suave);max-width:460px;margin:0 auto 24px}
.puerta .k-btn svg{width:20px;height:20px}
.cargando{color:var(--suave);text-align:center;padding:60px 0}
footer{border-top:1px solid #12204a;padding:26px 0;color:#6f84b3;font-size:14px}
footer a,footer button{color:#9fb4e0}
@media (max-width:560px){
  .perfil{flex-direction:column;text-align:center}
  .fila{flex-wrap:wrap}
  .bloque{padding:20px}
}
</style>
</head>
<body>
<nav><div class="centro">
  <a class="marca" href="./"><img src="imagenes/icono.png" alt="">KLEVOR</a>
  <div class="der"><a class="volver" href="./#comunidad">← Comunidad</a><span class="k-cuenta-nav" id="cuenta-nav"></span></div>
</div></nav>

<main class="centro" id="contenido">
  <p class="cargando">Cargando tu cuenta…</p>
</main>

<footer><div class="centro">
  <p><b>KLEVOR</b> · <a href="./">Inicio</a> · <a href="privacidad.html">Privacidad</a> · <a href="cookies.html">Cookies</a> ·
    <button type="button" class="kc-enlace-boton" data-kc-abrir>Configurar cookies</button></p>
</div></footer>
<script src="cookies.js" defer></script>
<script type="module" src="cuenta.js"></script>
</body>
</html>
